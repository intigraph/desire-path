name: Release

# Releases come from a merged release-please PR, not a hand-pushed tag (aegis-ebal6v.7.2):
# the same model as bobbin, quipu, seeds and yupana.
#
# release-please creates the tag and a DRAFT release with GITHUB_TOKEN, and GitHub does
# not re-trigger workflows from a token-authored tag push. So goreleaser runs in THIS run,
# gated on release_created, instead of on a tag trigger that cannot fire. The tag-push and
# workflow_dispatch arms remain as the manual fallback.
on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Existing version tag to (re)publish, e.g. v0.4.1"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  goreleaser:
    needs: release-please
    # always(): release-please is SKIPPED on the tag-push and dispatch arms, and a plain
    # `needs` would skip this job with it.
    if: >-
      always() &&
      (startsWith(github.ref, 'refs/tags/') ||
       github.event_name == 'workflow_dispatch' ||
       needs.release-please.outputs.release_created == 'true')
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || needs.release-please.outputs.tag_name }}
    outputs:
      release_tag: ${{ steps.release_tag.outputs.tag }}
    steps:
      - name: Expose the resolved release tag
        id: release_tag
        shell: bash
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
            echo "Invalid release tag" >&2
            exit 1
          fi
          printf 'tag=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"

      # Check out the release TAG, not the trigger ref: on the merge path the trigger is
      # main, and goreleaser must build exactly the tagged commit.
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.VERSION }}
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test ./...

      - name: Release
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.12.7
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Option B: verification expects a trusted host publisher only after explicit
  # repository admission. Unset is NOT ADMITTED, not a verification pass.
  repository-pendant-admission:
    name: Record repository pendant admission
    needs: goreleaser
    if: always() && needs.goreleaser.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    env:
      ADMISSION: ${{ vars.DP_PENDANT_PUBLICATION }}
    steps:
      - name: Record admission state
        run: |
          if [ "$ADMISSION" = enabled ]; then
            state="admitted: the trusted host publisher must deliver and Verify repository pendant runs"
          else
            state="NOT ADMITTED: no trusted publisher is enabled for desire-path, so no pendant is expected and Verify repository pendant is skipped by its condition (not a pass; aegis-ro425e.16)"
          fi
          echo "repository pendant publication: $state"
          echo "Repository pendant publication: $state" >> "$GITHUB_STEP_SUMMARY"

  repository-pendant:
    name: Verify repository pendant
    needs: goreleaser
    if: always() && needs.goreleaser.result == 'success' && vars.DP_PENDANT_PUBLICATION == 'enabled'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ needs.goreleaser.outputs.release_tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Verify the bounded public pointer corpus
        run: python3 scripts/verify-repository-share.py "$RELEASE_TAG" "$(git rev-parse HEAD)"

  # Tell scbrown/homebrew-tap that a release was published, so it regenerates
  # formulas now instead of at its next hourly reconciliation (aegis-em2). The
  # payload is informational: the tap still reads each repo's latest stable
  # release. Fails closed without failing the release run: no token, a release
  # that is missing, draft or prerelease, or any reply other than 204 means no
  # notification. Inactive until HOMEBREW_TAP_DISPATCH_TOKEN is set (aegis-7q7b).
  notify-tap:
    name: Notify Homebrew tap
    needs: [release-please, goreleaser]
    if: >-
      always() &&
      github.event_name != 'pull_request' &&
      needs.goreleaser.result == 'success' &&
      (startsWith(github.ref, 'refs/tags/') ||
       github.event_name == 'workflow_dispatch' ||
       needs.release-please.outputs.release_created == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      REPO: ${{ github.repository }}
      TAG: ${{ needs.goreleaser.outputs.release_tag }}
      GH_TOKEN: ${{ github.token }}
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_DISPATCH_TOKEN }}
    steps:
      - name: Dispatch stack-release to scbrown/homebrew-tap
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "::warning title=Homebrew tap not notified::HOMEBREW_TAP_DISPATCH_TOKEN is not set (aegis-7q7b). The tap's hourly schedule will reconcile."
            exit 0
          fi
          if [[ ! "$REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] ||
             [[ ! "$TAG" =~ ^([A-Za-z0-9]+-)*v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::warning title=Homebrew tap not notified::the release repository or tag is not well formed."
            exit 0
          fi
          # Only a published, non-draft, non-prerelease release is announced.
          if ! state="$(gh api "repos/$REPO/releases/tags/$TAG" --jq '"\(.draft) \(.prerelease)"')"; then
            echo "::warning title=Homebrew tap not notified::could not read the release for $TAG."
            exit 0
          fi
          if [ "$state" != "false false" ]; then
            echo "Release $TAG is not a published stable release (draft prerelease: $state); not notifying."
            exit 0
          fi
          body="$(jq -nc --arg repo "$REPO" --arg tag "$TAG" \
            '{event_type: "stack-release", client_payload: {repo: $repo, tag: $tag}}')"
          # Fixed URL, no redirects followed (no -L). The token reaches curl on
          # stdin (--config -), never on a command line or in the log.
          status="$(printf 'header = "Authorization: Bearer %s"\n' "$TAP_TOKEN" |
            curl --config - --silent --show-error --fail --proto '=https' --max-time 30 \
              --output /dev/null --write-out '%{http_code}' \
              --request POST \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              --data "$body" \
              https://api.github.com/repos/scbrown/homebrew-tap/dispatches)" || true
          if [ "$status" != 204 ]; then
            echo "::warning title=Homebrew tap not notified::dispatch answered HTTP ${status:-none}, not 204. The tap's hourly schedule will reconcile."
            exit 0
          fi
          echo "Notified scbrown/homebrew-tap: $REPO $TAG"
